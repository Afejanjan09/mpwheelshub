<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Contact Us -s MP WHEEL HUB</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f2f2f2;
    }
    header {
      background: #1e1e2f;
      color: white;
      text-align: center;
      padding: 20px;
    }
    .container {
      max-width: 600px;
      margin: 40px auto;
      background: white;
      padding: 30px;
      border-radius: 10px;
    }
    input, textarea {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border-radius: 5px;
      border: 1px solid #ccc;
    }
    button {
      background: #1e1e2f;
      color: white;
      padding: 12px 20px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    footer {
      background: #1e1e2f;
      color: white;
      text-align: center;
      padding: 20px;
      margin-top: 40px;
    }
  </style>
</head>
<body>
  <header>
    <h1>Contact Us</h1>
  </header>
  <div class="container">
    <form>
      <label>Your Name</label>
      <input type="text" placeholder="Enter your name" required>
      <label>Email</label>
      <input type="email" placeholder="Enter your email" required>
      <label>Message</label>
      <textarea rows="5" placeholder="Your message..."></textarea>
      <button type="submit">Send Message</button>
    </form>
  </div>
  <footer>
    &copy; 2025 MP WHEEL HUB. All rights reserved.
  </footer>
</body>
</html>
