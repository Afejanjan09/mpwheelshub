<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>MP WHEEL HUB</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background-color: #f5f5f5;
    }
    header {
      background-color: #1e1e2f;
      padding: 20px;
      color: white;
      text-align: center;
    }
    nav a {
      color: white;
      margin: 0 15px;
      text-decoration: none;
    }
    .hero {
      background: url('https://images.unsplash.com/photo-1605559424843-3b9e4112187c') no-repeat center center/cover;
      height: 300px;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }
    .hero h1 {
      font-size: 3rem;
      background: rgba(0,0,0,0.6);
      padding: 10px 20px;
    }
    .car-listings {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
      padding: 30px;
    }
    .car-card {
      background: white;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    .car-card img {
      width: 100%;
      height: 180px;
      object-fit: cover;
    }
    .car-card .info {
      padding: 15px;
    }
    .car-card .info h3 {
      margin: 0;
      font-size: 1.2rem;
      color: #333;
    }
    .car-card .info p {
      color: #777;
      margin: 5px 0 0;
    }
    footer {
      background: #1e1e2f;
      color: white;
      text-align: center;
      padding: 20px;
      margin-top: 30px;
    }
  </style>
</head>
<body>
  <header>
    <h1>MP WHEEL HUB</h1>
   <nav>
  <a href="index.html">Home</a>
  <a href="sell.html">Sell</a>
 
  <a href="contact.html">Contact</a>
</nav>

  </header>

  <section class="hero">
    <h1>Find Your Dream Car Today</h1>
  </section>

  <section class="car-listings">
    <div class="car-card">
      <img src="car1.jpg" alt="Car 1">
      <div class="info">
        <h3>Honda Civic 2020</h3>
        <p>₹9.5 Lakhs • Petrol • 25,000 KM</p>
        <a href="car-detail.html">more Detail</a>
      </div>
    </div>

    <div class="car-card">
      <img src="Car2.jpg" alt="Car 2">
      <div class="info">
        <h3>Hyundai Creta 2021</h3>
        <p>₹12.8 Lakhs • Diesel • 18,000 KM</p>
      </div>
    </div>

    <div class="car-card">
      <img src="car3.jpg" alt="Car 3">
      <div class="info">
        <h3>Maruti Swift 2019</h3>
        <p>₹6.3 Lakhs • Petrol • 35,000 KM</p>
      </div>
    </div>
  </section>

  <footer>
    &copy; 2025 MP WHEEL HUB. All rights reserved.
  </footer>
</body>
</html>
