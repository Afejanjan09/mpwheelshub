<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sell Your Car - MP WHEEL HUB</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f2f2f2;
      margin: 0;
    }
    .container {
      max-width: 700px;
      margin: 40px auto;
      background: white;
      padding: 30px;
      border-radius: 10px;
    }
    input, select, textarea {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border-radius: 5px;
      border: 1px solid #ccc;
    }
    button {
      background: #1e1e2f;
      color: white;
      padding: 12px 20px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    h2 {
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Sell Your Car</h2>
    <form>
      <input type="text" placeholder="Your Name" required>
      <input type="text" placeholder="Phone Number" required>
      <input type="text" placeholder="Car Model (e.g. Honda City 2018)" required>
      <input type="number" placeholder="Kilometers Driven" required>
      <select required>
        <option value="">Select Fuel Type</option>
        <option>Petrol</option>
        <option>Diesel</option>
        <option>CNG</option>
        <option>Electric</option>
      </select>
      <textarea rows="4" placeholder="Additional Details (Condition, Color, etc.)"></textarea>
      <button type="submit">Submit</button>
    </form>
  </div>
</body>
</html>
